odinâmica;`,`lesão de víscera ou estrutura importante;`,`conversão para cirurgia de maior porte;`,`duração operatória excessiva;`,`dificuldade técnica importante;`,`necessidade de dreno com monitorização;`,`suspeita de complicação;`,`necessidade de transfusão;`,`intercorrência anestésica;`,`impossibilidade de recuperação adequada no período previsto.`]}],conclusion:`A ausência de complicações intraoperatórias é condição essencial para manutenção do regime ambulatorial.`},{id:`discharge`,label:`Alta no mesmo dia`,title:`Critérios de alta no mesmo dia`,introduction:`O paciente deverá preencher todos os seguintes critérios:`,groups:[{items:[`lúcido e orientado;`,`sinais vitais estáveis;`,`recuperação anestésica satisfatória;`,`dor controlada com medicação oral;`,`náuseas e vômitos ausentes ou controlados;`,`ausência de sangramento ativo;`,`tolerância à ingestão oral;`,`capacidade de sentar, levantar e caminhar de acordo com sua condição basal;`,`diurese adequada quando pertinente ao procedimento;`,`curativo adequado;`,`ausência de complicações cirúrgicas;`,`presença de acompanhante;`,`prescrição e orientações entregues;`,`telefone de contato e fluxo de retorno definidos.`]}],conclusion:`A decisão de alta deve ser compartilhada entre cirurgia, anestesiologia e enfermagem.`},{id:`unplanned-admission`,label:`Internação não planejada`,title:`Critérios para internação não planejada`,groups:[{items:[`dor sem controle;`,`náuseas ou vômitos persistentes;`,`sangramento;`,`retenção urinária;`,`hipotensão ou hipertensão persistente;`,`dessaturação;`,`sonolência prolongada;`,`febre;`,`dificuldade de deambulação;`,`intolerância à dieta;`,`complicação cirúrgica ou anestésica;`,`insegurança do paciente ou da equipe;`,`ausência inesperada de acompanhante ou suporte domiciliar.`]}]}],Kl=G(`<button type="button" aria-controls="hospital-day-reference-content"> </button>`),ql=G(`<p class="introduction svelte-1womfu7"> </p>`),Jl=G(`<h4 class="svelte-1womfu7"> </h4>`),Yl=G(`<li class="svelt
