roladas.`,`Bom estado funcional.`,`Ausência de infecção sistêmica ativa.`,`Ausência de anemia importante ou distúrbio de coagulação não corrigido.`,`Capacidade de compreender e seguir orientações.`,`IMC preferencialmente inferior a 30 kg/m², admitindo-se pacientes com IMC superior de forma individualizada, conforme tipo de procedimento, risco anestésico e estrutura disponível.`,`Boa condição nutricional ou ausência de desnutrição clinicamente relevante.`,`Possibilidade de deambulação e alimentação após o procedimento.`]},{title:`Critérios relacionados à cirurgia`,items:[`Procedimento eletivo.`,`Duração previsível, preferencialmente de até duas horas.`,`Baixo risco de sangramento.`,`Baixo risco de lesão visceral ou necessidade de conversão para cirurgia de maior porte.`,`Dor pós-operatória controlável com analgesia oral.`,`Baixa probabilidade de necessidade de drenos, sondas ou cuidados complexos.`,`Ausência de expectativa de transfusão.`,`Possibilidade de alimentação, mobilização e alta no mesmo dia.`,`Ausência de dificuldade técnica relevante previsível.`,{text:`Devem ser avaliados previamente outros fatores:`,items:[`inflamação local;`,`fibrose;`,`anatomia desfavorável;`,`cirurgias prévias;`,`obesidade;`,`hérnias recidivadas;`,`aderências;`,`extensão da doença;`,`necessidade provável de ressecção ampliada.`]}]},{title:`Critérios anestésicos`,items:[`Avaliação pré-anestésica concluída.`,`Via aérea sem risco elevado ou com planejamento definido.`,`Baixo risco de complicações respiratórias.`,`Bom controle de náuseas e vômitos pós-operatórios.`,`Recuperação anestésica previsivelmente rápida.`,`Ausência de histórico de complicação anestésica grave sem investigação.`,`Possibilidade de anestesia geral, regional ou local conforme o procedimento.`]},{title:`Critérios sociais e logísticos`,items:[`Residência na região metropolitana de Fortaleza.`,`Presença de acompanhante adulto responsável.`,`Acompanhante disponível nas primeiras 24 horas.`,`Residência em local com acesso
