as é condição essencial para manutenção do regime ambulatorial.`},{id:`discharge`,label:`Alta no mesmo dia`,title:`Critérios de alta no mesmo dia`,introduction:`O paciente deverá preencher todos os seguintes critérios:`,groups:[{items:[`lúcido e orientado;`,`sinais vitais estáveis;`,`recuperação anestésica satisfatória;`,`dor controlada com medicação oral;`,`náuseas e vômitos ausentes ou controlados;`,`ausência de sangramento ativo;`,`tolerância à ingestão oral;`,`capacidade de sentar, levantar e caminhar de acordo com sua condição basal;`,`diurese adequada quando pertinente ao procedimento;`,`curativo adequado;`,`ausência de complicações cirúrgicas;`,`presença de acompanhante;`,`prescrição e orientações entregues;`,`telefone de contato e fluxo de retorno definidos.`]}],conclusion:`A decisão de alta deve ser compartilhada entre cirurgia, anestesiologia e enfermagem.`},{id:`unplanned-admission`,label:`Internação não planejada`,title:`Critérios para internação não planejada`,groups:[{items:[`dor sem controle;`,`náuseas ou vômitos persistentes;`,`sangramento;`,`retenção urinária;`,`hipotensão ou hipertensão persistente;`,`dessaturação;`,`sonolência prolongada;`,`febre;`,`dificuldade de deambulação;`,`intolerância à dieta;`,`complicação cirúrgica ou anestésica;`,`insegurança do paciente ou da equipe;`,`ausência inesperada de acompanhante ou suporte domiciliar.`]}]}],wc=G(`<button type="button" aria-controls="hospital-day-reference-content"> </button>`),Tc=G(`<p class="introduction svelte-1womfu7"> </p>`),Ec=G(`<h4 class="svelte-1womfu7"> </h4>`),Dc=G(`<li class="svelte-1womfu7"> </li>`),Oc=G(` <ul class="svelte-1womfu7"></ul>`,1),kc=G(`<li class="svelte-1womfu7"><!></li>`),Ac=G(`<div class="criteria-group svelte-1womfu7"><!> <ul class="svelte-1womfu7"></ul></div>`),jc=G(`<p class="conclusion svelte-1womfu7"> </p>`),Mc=G(`<h3 id="hospital-day-section-title" class="svelte-1womfu7"> </h3> <!> <div class="criteria-groups svelte-1womfu7"></div> <!> <p class="source-caption s
